name: Cross-Language Benchmark Comparison

on:
  push:
    paths:
      - "go/**"
      - "dotnet/**"
      - ".devcontainer/install-openssl.sh"
      - ".github/workflows/benchmark-comparison.yml"
  pull_request:
    paths:
      - "go/**"
      - "dotnet/**"
      - ".devcontainer/install-openssl.sh"
      - ".github/workflows/benchmark-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Shared-runner benchmark suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BENCHMARK_REPETITIONS: 20
      BENCHMARK_ITERATIONS: 100
      TLS_WARMUP_ITERATIONS: 1
      BENCHMARK_INPUT_DIR: ${{ github.workspace }}/comparison-inputs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
          cache-dependency-path: go/go.mod

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Set up .NET 11 preview
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Record toolchains
        run: |
          mkdir -p "$BENCHMARK_INPUT_DIR"
          {
            uname -a
            go version
            dotnet --info
          } > "$BENCHMARK_INPUT_DIR/toolchains.txt"

      - name: Restore OpenSSL 3.5 cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-3.5
          key: openssl-${{ runner.os }}-${{ runner.arch }}-3.5.0-${{ hashFiles('.devcontainer/install-openssl.sh') }}

      - name: Restore OpenSSL 4.0 cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-4.0
          key: openssl-${{ runner.os }}-${{ runner.arch }}-4.0.0-${{ hashFiles('.devcontainer/install-openssl.sh') }}

      - name: Install OpenSSL 3.5.0 when absent
        env:
          OPENSSL_INSTALL_PREFIX: ${{ runner.temp }}/openssl-3.5
        run: bash .devcontainer/install-openssl.sh 3.5.0

      - name: Install OpenSSL 4.0.0 when absent
        env:
          OPENSSL_INSTALL_PREFIX: ${{ runner.temp }}/openssl-4.0
        run: bash .devcontainer/install-openssl.sh 4.0.0

      - name: Run Go benchmarks
        run: |
          mkdir -p "$BENCHMARK_INPUT_DIR/comparison-go"
          cd go
          go test ./...
          BENCHMARK_RESULTS_PATH="$BENCHMARK_INPUT_DIR/comparison-go/benchmark-results.txt" \
          BENCHMARK_RECORD_PATH="$BENCHMARK_INPUT_DIR/comparison-go/benchmark-record.json" \
            bash run-benchmarks.sh

      - name: Run .NET benchmarks
        run: |
          run_dotnet_benchmark() {
            local framework="$1"
            local channel="$2"
            local openssl_version="$3"
            local openssl_label="$4"
            local input_directory="$BENCHMARK_INPUT_DIR/comparison-dotnet-${framework}-openssl-${openssl_label}"
            local openssl_prefix="$RUNNER_TEMP/openssl-${openssl_label}"

            mkdir -p "$input_directory"
            env \
              DOTNET_TARGET_FRAMEWORK="$framework" \
              BENCHMARK_RUNTIME_CHANNEL="$channel" \
              BENCHMARK_OPENSSL_VERSION="$openssl_version" \
              BENCHMARK_OPENSSL_PREFIX="$openssl_prefix" \
              BENCHMARK_ARTIFACTS_DIR="$input_directory" \
              LD_LIBRARY_PATH="$openssl_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              bash dotnet/run-benchmarks.sh
          }

          run_dotnet_benchmark net10.0 ga 3.5.0 3.5
          run_dotnet_benchmark net10.0 ga 4.0.0 4.0
          run_dotnet_benchmark net11.0 preview 3.5.0 3.5
          run_dotnet_benchmark net11.0 preview 4.0.0 4.0

      - name: Build comparison report
        run: |
          cd go
          go run ./cmd/benchmarkcompare merge \
            --input-dir "$BENCHMARK_INPUT_DIR" \
            --output-dir ../comparison \
            --require-complete

      - name: Upload comparison inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: comparison-inputs
          path: comparison-inputs/
          if-no-files-found: error

      - name: Upload comparison report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: comparison-report
          path: comparison/
          if-no-files-found: error