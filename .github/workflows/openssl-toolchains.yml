name: OpenSSL Toolchain Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    name: OpenSSL ${{ matrix.label }} toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "3.5"
            version: "3.5.0"
          - label: "4.0"
            version: "4.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore OpenSSL ${{ matrix.label }} cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openssl-${{ matrix.label }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('.devcontainer/install-openssl.sh') }}

      - name: Install OpenSSL ${{ matrix.version }} when absent
        env:
          OPENSSL_INSTALL_PREFIX: ${{ runner.temp }}/openssl-${{ matrix.label }}
        run: bash .devcontainer/install-openssl.sh "${{ matrix.version }}"

      - name: Verify cached toolchain
        env:
          OPENSSL_INSTALL_PREFIX: ${{ runner.temp }}/openssl-${{ matrix.label }}
        run: |
          test -x "$OPENSSL_INSTALL_PREFIX/bin/openssl"
          "$OPENSSL_INSTALL_PREFIX/bin/openssl" version