name: Go Tests and Benchmarks

on:
  push:
    paths:
      - "go/**"
      - ".github/workflows/go-tests-and-benchmarks.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-tests-and-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [test, race]
    defaults:
      run:
        working-directory: go

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.mod

      - name: Run tests
        if: matrix.mode == 'test'
        run: go test ./...

      - name: Run race detector
        if: matrix.mode == 'race'
        run: go test -race ./...

      - name: Run vet
        if: matrix.mode == 'test'
        run: go vet ./...

      - name: Run benchmarks
        if: matrix.mode == 'test'
        run: |
          bash run-benchmarks.sh

      - name: Upload benchmark results
        if: always() && matrix.mode == 'test'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-benchmark-results
          path: |
            go/benchmark-results.txt
            go/benchmark-record.json
          if-no-files-found: warn