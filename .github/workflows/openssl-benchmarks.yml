name: OpenSSL Benchmark Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: .NET ${{ matrix.dotnet-label }} / OpenSSL ${{ matrix.openssl-label }} benchmarks
    runs-on: ubuntu-slim
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-label: "10"
            dotnet-version: "10.0.x"
            dotnet-quality: "ga"
            target-framework: "net10.0"
            openssl-label: "3.5"
            openssl-version: "3.5.0"
            artifact-name: "dotnet-10-openssl-3.5-benchmarks"
          - dotnet-label: "10"
            dotnet-version: "10.0.x"
            dotnet-quality: "ga"
            target-framework: "net10.0"
            openssl-label: "4.0"
            openssl-version: "4.0.0"
            artifact-name: "dotnet-10-openssl-4.0-benchmarks"
          - dotnet-label: "11 preview"
            dotnet-version: "11.0.x"
            dotnet-quality: "preview"
            target-framework: "net11.0"
            openssl-label: "3.5"
            openssl-version: "3.5.0"
            artifact-name: "dotnet-11-preview-openssl-3.5-benchmarks"
          - dotnet-label: "11 preview"
            dotnet-version: "11.0.x"
            dotnet-quality: "preview"
            target-framework: "net11.0"
            openssl-label: "4.0"
            openssl-version: "4.0.0"
            artifact-name: "dotnet-11-preview-openssl-4.0-benchmarks"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET ${{ matrix.dotnet-label }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          dotnet-quality: ${{ matrix.dotnet-quality }}

      - name: Install OpenSSL ${{ matrix.openssl-version }}
        run: bash .devcontainer/install-openssl.sh "${{ matrix.openssl-version }}"

      - name: Run benchmarks
        env:
          DOTNET_TARGET_FRAMEWORK: ${{ matrix.target-framework }}
        run: bash ./run-benchmarks.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/
