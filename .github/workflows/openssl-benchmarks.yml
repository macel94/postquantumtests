name: OpenSSL Benchmark Comparison

on:
  workflow_dispatch:

jobs:
  openssl-35:
    name: OpenSSL 3.5.0 benchmarks
    runs-on: ubuntu-slim
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install OpenSSL 3.5.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            perl \
            pkg-config

          source_version="3.5.0"
          install_prefix="/usr/local/openssl-3.5"
          source_archive="openssl-${source_version}.tar.gz"
          source_url="https://www.openssl.org/source/${source_archive}"
          build_root="/tmp/openssl-${source_version}-build"

          rm -rf "${build_root}"
          mkdir -p "${build_root}"
          cd "${build_root}"

          curl -fsSLO "${source_url}"
          tar -xzf "${source_archive}"
          cd "openssl-${source_version}"

          ./Configure linux-x86_64 shared --prefix="${install_prefix}" --openssldir="${install_prefix}/ssl" --libdir=lib
          make -j"$(nproc)"
          sudo make install_sw

          sudo sh -c "printf '%s\n' '${install_prefix}/lib' > /etc/ld.so.conf.d/openssl-3.5.conf"
          sudo ldconfig
          "${install_prefix}/bin/openssl" version

      - name: Run benchmarks
        run: bash ./run-benchmarks.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-3.5-benchmarks
          path: artifacts/

  openssl-40:
