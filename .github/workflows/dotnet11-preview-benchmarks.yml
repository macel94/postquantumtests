name: .NET 11 Preview Benchmarks

on:
  push:
    paths:
      - "dotnet/**"
      - "go/cmd/**"
      - ".github/workflows/dotnet11-preview-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: .NET 11 preview / OpenSSL ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "3.5"
            version: "3.5.0"
            artifact: "dotnet-11-preview-openssl-3.5-benchmarks"
          - label: "4.0"
            version: "4.0.0"
            artifact: "dotnet-11-preview-openssl-4.0-benchmarks"
    env:
      DOTNET_TARGET_FRAMEWORK: net11.0
      BENCHMARK_OPENSSL_VERSION: ${{ matrix.version }}
      BENCHMARK_RUNTIME_CHANNEL: preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go for report generation
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.mod

      - name: Set up .NET 11 preview
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore OpenSSL ${{ matrix.label }} cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-${{ matrix.label }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('.devcontainer/install-openssl.sh') }}

      - name: Install OpenSSL ${{ matrix.version }} when absent
        env:
          OPENSSL_INSTALL_PREFIX: ${{ runner.temp }}/openssl-${{ matrix.label }}
        run: bash .devcontainer/install-openssl.sh "${{ matrix.version }}"

      - name: Run .NET benchmarks
        run: bash dotnet/run-benchmarks.sh

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dotnet/artifacts/
          if-no-files-found: warn